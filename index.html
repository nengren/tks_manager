<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TK Store Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F3EA;</text></svg>">
<style>
:root{--pri:#0ea5e9;--pri-d:#0284c7;--pri-l:#e0f2fe;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--text2:#64748b;
--text3:#94a3b8;--ok:#10b981;--ok-bg:#ecfdf5;--warn:#f59e0b;--warn-bg:#fffbeb;--bad:#ef4444;--bad-bg:#fef2f2;
--border:#e2e8f0;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06);--sidebar:#1e293b;--sidebar-hover:#334155;
--sidebar-active:#0ea5e9}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
::selection{background:var(--pri-l)}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)}
.login-box{background:#fff;border-radius:16px;padding:48px 40px;width:400px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.login-box h1{font-size:1.6rem;text-align:center;margin-bottom:4px}
.login-box .sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:32px}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.92rem;outline:none;transition:border .2s;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
.fg textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-pri{background:var(--pri);color:#fff;width:100%}.btn-pri:hover{background:var(--pri-d)}
.btn-ok{background:var(--ok);color:#fff}.btn-bad{background:var(--bad);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border)}.btn-ghost:hover{border-color:var(--text3)}
.btn-sm{padding:6px 14px;font-size:.78rem}
.err-msg{color:var(--bad);font-size:.82rem;text-align:center;margin-top:14px;min-height:20px}
#app{display:none;height:100vh;overflow:hidden}
.app-wrap{display:flex;height:100%}
.sidebar{width:230px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand h2{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-brand p{font-size:.7rem;color:rgba(255,255,255,.4);margin-top:2px}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.6);
font-size:.85rem;margin-bottom:2px;transition:all .15s;border:none;background:none;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600}
.nav-item .ni{font-size:1.1rem;width:24px;text-align:center}
.nav-badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--bad);color:#fff;
border-radius:10px;font-size:.62rem;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.nav-sep{border-top:1px solid rgba(255,255,255,.08);margin:10px 14px}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-footer .sf-name{font-size:.82rem;font-weight:600}
.sidebar-footer .sf-role{font-size:.68rem;color:rgba(255,255,255,.4)}
.sidebar-footer button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);
padding:6px 14px;border-radius:6px;font-size:.75rem;cursor:pointer;width:100%}
.sidebar-footer button:hover{background:rgba(255,255,255,.05);color:#fff}
.main{flex:1;overflow-y:auto;padding:28px 36px}
.main-header{margin-bottom:24px}
.main-header h1{font-size:1.4rem;font-weight:700}
.main-header p{font-size:.82rem;color:var(--text2);margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h3{font-size:1rem;margin-bottom:4px}
.card .sub-label{font-size:.75rem;color:var(--text3)}
.sec-title{font-size:.78rem;font-weight:700;color:var(--text2);margin:20px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-val{font-size:1.6rem;font-weight:700}
.stat-label{font-size:.72rem;color:var(--text2);margin-top:4px}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.action-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:24px 16px;
text-align:center;cursor:pointer;transition:all .15s}
.action-btn:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 4px 12px rgba(14,165,233,.15)}
.action-btn .ai{font-size:2.2rem;margin-bottom:8px}
.action-btn .az{font-size:.92rem;font-weight:600}
.action-btn .ae{font-size:.72rem;color:var(--text2);margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.form-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.score-table{width:100%;border-collapse:collapse;font-size:.82rem}
.score-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);font-size:.72rem;text-transform:uppercase;color:var(--text2);font-weight:700}
.score-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9}
.score-table tr:hover td{background:#fafbfc}
.sv-good{color:var(--ok);font-weight:700}.sv-mid{color:var(--warn);font-weight:700}.sv-bad{color:var(--bad);font-weight:700}
.sop-item{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:#fff}
.sop-head{padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.88rem;transition:background .1s}
.sop-head:hover{background:#fafbfc}
.sop-head .arrow{transition:transform .2s;color:var(--text3)}
.sop-item.open .sop-head .arrow{transform:rotate(90deg)}
.sop-body{display:none;padding:20px;border-top:1px solid var(--border);font-size:.82rem;line-height:1.8}
.sop-item.open .sop-body{display:block}
.sop-impact{display:inline-block;background:var(--pri-l);color:var(--pri-d);padding:3px 12px;border-radius:20px;font-size:.72rem;font-weight:600;margin-bottom:14px}
.sop-step{margin-bottom:8px;padding-left:22px;position:relative}
.sop-step::before{content:'';position:absolute;left:6px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--pri)}
.sop-step .s-zh{font-weight:500}
.sop-step .s-en{color:var(--text2)}
.sop-tpl{background:#f8fafc;border-left:3px solid var(--pri);padding:12px 16px;margin:14px 0;border-radius:0 8px 8px 0;font-size:.8rem;color:var(--text2);white-space:pre-wrap}
.hm-label{font-size:.75rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}.hm-sub{font-size:.78rem;color:var(--text3);font-weight:400}
.hm-notice{display:flex;gap:12px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}.hm-notice-text{font-size:1.05rem;font-weight:600;color:#78350f;line-height:1.5}
.hm-done{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46;font-size:1.05rem;text-align:center}
.hm-hero{background:linear-gradient(135deg,#eff6ff,#e0f2fe);border-color:#bae6fd}.hm-big{font-size:2rem;font-weight:800;color:var(--pri)}.hm-big span{font-size:.85rem;font-weight:500;color:var(--text2)}
.hm-bar{height:10px;background:#fff;border-radius:6px;overflow:hidden;margin-top:8px}.hm-bar div{height:100%;background:linear-gradient(90deg,#38bdf8,#10b981);border-radius:6px;transition:width .6s}
.hm-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}.hm-chip{background:#fff;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:.8rem;border:1px solid var(--border)}.hm-chip.ok{border-left:4px solid var(--ok)}.hm-chip.lost{border-left:4px solid var(--bad);opacity:.85}
.hm-fire{color:#ea580c;font-weight:600}.hm-lost{color:var(--bad);font-size:.75rem}
.hm-news-item{padding:6px 0;font-size:.88rem;border-bottom:1px dashed var(--border)}.hm-news-item:last-child{border-bottom:none}
.hm-winners{background:linear-gradient(135deg,#fdf4ff,#fae8ff);border-color:#f0abfc}.hm-winners-mon{box-shadow:0 0 0 3px #f0abfc}.hm-win{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.95rem}.hm-money{color:#a21caf;font-size:1.1rem}
.hm-action{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.88rem}.hm-action:last-child{border-bottom:none}.hm-action:hover{background:var(--pri-l)}.hm-action-ic{font-size:1.2rem}
.hm-confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}.hm-confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:hmFall linear forwards}
@keyframes hmFall{to{top:105vh;transform:rotate(720deg)}}
.cs-card{padding:16px 20px}.cs-q{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;font-size:.88rem}.cs-actions{display:flex;gap:6px;flex-shrink:0}.cs-actions .btn{width:auto}.cs-en{color:var(--text2);font-size:.8rem;font-weight:400}.cs-tip{margin-top:8px;font-size:.8rem;color:#92400e;background:var(--warn-bg);padding:6px 10px;border-radius:6px}.cs-reply{margin-top:10px;background:#f8fafc;border-left:3px solid var(--pri);padding:12px 16px;border-radius:0 8px 8px 0;font-size:.84rem;white-space:pre-wrap;line-height:1.6}
.badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:.68rem;font-weight:600;background:var(--pri-l);color:var(--pri-d)}
.badge-staff{background:var(--ok-bg);color:var(--ok)}
.badge-secretary{background:#fdf4ff;color:#a21caf}
.sheet-table{width:100%;border-collapse:collapse;font-size:.8rem}
.sheet-table th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:6px 8px;border:1px solid var(--border);font-size:.68rem;text-transform:uppercase;color:var(--text2)}
.sheet-table td{padding:5px 8px;border:1px solid #f1f5f9;white-space:nowrap}
.sheet-table tr:hover td{background:#fafbfc}
.exp-approved td{color:var(--ok)}
.exp-thumb{width:26px;height:26px;object-fit:cover;border-radius:4px;cursor:pointer;vertical-align:middle;border:1px solid var(--border)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.calc-box{background:var(--pri-l);border-radius:8px;padding:12px 16px;font-size:.82rem;color:var(--pri-d);margin:12px 0}
.detail-toggle{font-size:.8rem;color:var(--pri);cursor:pointer;margin:10px 0;display:inline-block}
.detail-toggle:hover{text-decoration:underline}
.toast{position:fixed;top:24px;right:24px;background:var(--sidebar);color:#fff;padding:12px 28px;border-radius:8px;font-size:.85rem;z-index:300;opacity:0;transition:opacity .3s;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1}
/* TODOS */
.todo-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;transition:box-shadow .15s}
.todo-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.todo-item.status-open{border-left:4px solid var(--pri)}
.todo-item.status-claimed{border-left:4px solid var(--warn)}
.todo-item.status-submitted{border-left:4px solid var(--pri)}
.todo-item.status-rejected{border-left:4px solid var(--bad)}
.todo-item.status-done{border-left:4px solid var(--ok)}
.todo-item.status-done{border-left:4px solid var(--ok);opacity:.65}
.todo-item.status-archived{border-left:4px solid var(--text3);opacity:.45}
.todo-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.todo-title{font-size:.92rem;font-weight:600;flex:1}
.tbadge{padding:2px 10px;border-radius:20px;font-size:.65rem;font-weight:700}
.tbadge-open{background:var(--pri-l);color:var(--pri-d)}
.tbadge-claimed{background:var(--warn-bg);color:#92400e}
.tbadge-submitted{background:var(--pri-l);color:var(--pri-d)}
.tbadge-rejected{background:var(--bad-bg);color:var(--bad)}
.todo-result{background:#f0fdf4;border-left:3px solid var(--ok);padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0;font-size:.82rem}
.todo-reject{background:var(--bad-bg);border-left:3px solid var(--bad);padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0;font-size:.82rem}
.tbadge-done{background:var(--ok-bg);color:#065f46}
.todo-meta{font-size:.72rem;color:var(--text3);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px}
.todo-desc{font-size:.8rem;color:var(--text2);margin-top:8px;line-height:1.6}
.todo-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tab-filter{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tf-btn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s}
.tf-btn.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.leaderboard-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.leaderboard-row:last-child{border:none}
.lb-rank{font-size:1.1rem;width:28px;text-align:center}
.lb-name{font-size:.88rem;font-weight:600}
.lb-bar{height:6px;background:var(--pri-l);border-radius:3px;margin-top:4px;min-width:60px}
.lb-bar-fill{height:6px;background:var(--pri);border-radius:3px;transition:width .4s}
.lb-count{font-size:.82rem;font-weight:700;color:var(--pri);white-space:nowrap}
/* Reminder modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:16px;padding:32px 28px;width:480px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box h2{font-size:1.2rem;margin-bottom:6px}
.modal-sub{font-size:.82rem;color:var(--text2);margin-bottom:20px}
.modal-todo-list{max-height:300px;overflow-y:auto}
.modal-todo-item{padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fafbfc}
.modal-todo-item .mt-title{font-size:.88rem;font-weight:600}
.modal-todo-item .mt-meta{font-size:.72rem;color:var(--text3);margin-top:3px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
/* Chat */
.chat-wrap{display:flex;height:calc(100vh - 56px);margin:-28px -36px;overflow:hidden}
.chat-list{width:250px;border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column;flex-shrink:0}
.chat-list-header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:.92rem}
.chat-list-body{flex:1;overflow-y:auto}
.chat-conv{padding:10px 16px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;transition:background .1s}
.chat-conv:hover{background:#f8fafc}
.chat-conv.active{background:var(--pri-l)}
.chat-conv-info{flex:1;min-width:0}
.chat-conv-name{font-size:.82rem;font-weight:600}
.chat-conv-preview{font-size:.7rem;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-unread{background:var(--bad);color:#fff;border-radius:10px;font-size:.6rem;font-weight:700;padding:2px 7px;min-width:18px;text-align:center;flex-shrink:0;margin-left:8px}
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.chat-main-header{padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);font-weight:600;font-size:.88rem;flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:16px 20px}
.chat-msg{margin-bottom:14px;max-width:70%;display:flex;flex-direction:column}
.chat-msg.mine{margin-left:auto;align-items:flex-end}
.chat-msg .cm-name{font-size:.68rem;color:var(--text2);margin-bottom:3px;font-weight:600}
.chat-msg .cm-bubble{padding:10px 14px;border-radius:14px;font-size:.85rem;line-height:1.5;word-wrap:break-word}
.chat-msg.other .cm-bubble{background:#fff;border:1px solid var(--border);border-top-left-radius:4px}
.chat-msg.mine .cm-bubble{background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.chat-msg .cm-time{font-size:.6rem;color:var(--text3);margin-top:3px}
.chat-msg .cm-del{font-size:.6rem;color:var(--text3);cursor:pointer;margin-left:6px;opacity:0;transition:opacity .15s}
.chat-msg:hover .cm-del{opacity:1}
.chat-msg .cm-del:hover{color:var(--bad)}
.cm-deleted{font-style:italic;color:var(--text3)!important;background:#f8fafc!important;border:1px dashed var(--border)!important}
.cm-deleted-admin{text-decoration:line-through;opacity:.6}
.chat-input{padding:12px 16px;background:#fff;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.chat-input input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;outline:none}
.chat-input input:focus{border-color:var(--pri)}
.chat-input button{padding:10px 20px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.chat-input button:hover{background:var(--pri-d)}
.chat-img-btn{display:flex;align-items:center;justify-content:center;width:42px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:1.1rem;background:#fff;flex-shrink:0}.chat-img-btn:hover{border-color:var(--pri);background:var(--pri-l)}
.chat-msg .cm-bubble.cm-bubble-img{width:fit-content;padding:4px;background:#fff!important;border:1px solid var(--border)}.cm-img{display:block;max-width:220px;max-height:220px;border-radius:10px;cursor:zoom-in}
.chat-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:.88rem;text-align:center}
.chat-sec{padding:8px 16px;font-size:.66rem;font-weight:700;color:var(--text3);text-transform:uppercase;background:#fafbfc;border-bottom:1px solid #f1f5f9}
.chat-date-sep{text-align:center;margin:16px 0 8px;font-size:.68rem;color:var(--text3)}
@media(max-width:900px){
.sidebar{width:200px}.main{padding:20px}
.stats-row,.quick-actions{grid-template-columns:repeat(2,1fr)}
.form-row-3,.form-row-4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="loginPage">
<div class="login-box">
<h1>&#x1F3EA; Online Store Manager</h1>
<p class="sub">店铺管理系统 &middot; Store Management System</p>
<div class="fg"><label>用户名 Username</label><input type="text" id="loginUser" autocomplete="username" autocapitalize="off"></div>
<div class="fg"><label>密码 Password</label><input type="password" id="loginPass" autocomplete="current-password"></div>
<button class="btn btn-pri" onclick="doLogin()">登录 Login</button>
<div class="err-msg" id="loginErr"></div>
</div>
</div>

<div id="app">
<div class="app-wrap">
<aside class="sidebar">
<div class="sidebar-brand"><h2>&#x1F3EA; TK Store</h2><p>Store Management System</p></div>
<nav class="sidebar-nav" id="sideNav"></nav>
<div class="sidebar-footer">
<div class="sf-name" id="sfName"></div>
<div class="sf-role" id="sfRole"></div>
<button onclick="doLogout()">退出登录 Logout</button>
</div>
</aside>
<div class="main"><div id="mainBody"></div></div>
</div>
</div>

<div class="toast" id="toast"></div>

/* ---- IMAGE UPLOAD (shared: expense receipts, future chat photos) ---- */
function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}}else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(b=>b?resolve(b):reject(new Error('compress failed')),'image/jpeg',quality);
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
async function uploadImage(file,folder){
  const blob=await compressImage(file,1000,0.6);
  const path=folder+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
  const res=await fetch(SB_URL+'/storage/v1/object/tks-uploads/'+path,{
    method:'POST',headers:{...sb.h,'Content-Type':'image/jpeg'},body:blob
  });
  if(!res.ok)throw new Error('upload failed: '+res.status);
  return SB_URL+'/storage/v1/object/public/tks-uploads/'+path;
}

function timeAgo(ts){
  if(!ts)return '';
  const diff=Math.floor((Date.now()-new Date(ts))/1000);
  if(diff<60)return '刚刚 Just now';
  if(diff<3600)return Math.floor(diff/60)+'分钟前 mins ago';
  if(diff<86400)return Math.floor(diff/3600)+'小时前 hrs ago';
  return Math.floor(diff/86400)+'天前 days ago';
}

function hmGreeting(){
  const h=new Date().getHours();
  if(h<12)return {tl:'Magandang umaga',zh:'早上好',ic:'☀️'};
  if(h<18)return {tl:'Magandang hapon',zh:'下午好',ic:'🌤️'};
  return {tl:'Magandang gabi',zh:'晚上好',ic:'🌙'};
}
function hmStreak(byStoreDate,storeId,t){
  // 从今天（今天还没登记就从昨天）往回数连续登记的天数，最多算 60 天
  let d=byStoreDate[storeId+'_'+t]?t:addDays(t,-1),n=0;
  while(n<60){const sc=byStoreDate[storeId+'_'+d];if(!(sc&&sc.overall_score!=null))break;n++;d=addDays(d,-1);}
  return n;
}
function hmConfetti(){
  const colors=['#f59e0b','#10b981','#3b82f6','#ef4444','#8b5cf6','#ec4899'];
  const box=document.createElement('div');box.className='hm-confetti';
  for(let i=0;i<70;i++){const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw';p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.6)+'s';p.style.animationDuration=(2+Math.random()*1.5)+'s';
    p.style.transform='rotate('+Math.random()*360+'deg)';box.appendChild(p);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),4500);
}

    }
    if([7,14,21,30,60].includes(i.streak)&&i.today)news.push(`🔥 <b>${esc(i.store.store_name)}</b> 已连续登记 ${i.streak} 天！${i.streak}-day streak!`);
  }
  const teamAssigned=infoAll.filter(i=>i.store.assigned_to);
  if(teamAssigned.length&&teamAssigned.every(i=>i.qualified)&&thisWeek.some(d=>d<t))news.push(`💪 全队所有店铺本周都在达标线上！Every store is on track this week!`);
  if(news.length)h+=`<div class="card hm-news"><div class="hm-label">📈 好消息 Good News</div>${news.map(n=>`<div class="hm-news-item">${n}</div>`).join('')}</div>`;

  // ⑤ 上周获奖榜（只表扬拿到奖的人）
  const winners={};
  for(const s of stores){if(!s.assigned_to)continue;const st=storeWeekStat(byStoreDate,s.id,lastWeek);
    if(st.qualified){if(!winners[s.assigned_to])winners[s.assigned_to]={total:0,n:0};winners[s.assigned_to].total+=st.reward;winners[s.assigned_to].n++;}}
  const wl=Object.entries(winners).sort((a,b)=>b[1].total-a[1].total);
  if(wl.length){
    const isMon=new Date().getDay()===1;
    h+=`<div class="card hm-winners${isMon?' hm-winners-mon':''}"><div class="hm-label">🏆 上周获奖 Last Week's Winners <span class="hm-sub">${lastWeek[0].slice(5)} ~ ${lastWeek[6].slice(5)}</span></div>
      ${wl.map(([uid,w],idx)=>`<div class="hm-win"><span>${['🥇','🥈','🥉'][idx]||'🎖️'} <b>${esc(staffName(uid))}</b> <span class="hm-sub">${w.n} 家店达标 store(s) qualified</span></span><b class="hm-money">₱${w.total}</b></div>`).join('')}
      <div class="hm-sub" style="margin-top:6px">Congratulations po! 恭喜！🎉</div></div>`;

  // ⑥ 今天要处理
  h+=`<div class="sec-title">✅ 今天要处理 To Do Today</div>`;

  // 管理员：截图逾期 + 私下抽查（保留原功能）
  if(top){
    const overdue=scores.filter(s=>s.audit_flagged_at&&!s.audit_image_url&&!s.audit_resolved&&(Date.now()-new Date(s.audit_flagged_at).getTime())>2*60*60*1000);

      for(const o of overdue){const st=stores.find(x=>x.id===o.store_id);

          <button class="btn btn-ghost btn-sm" onclick="resolveAudit('${o.store_id}','${o.record_date}')">✅ 已去后台核实，标记通过 Verified in backend, mark OK</button>
        </div>`;}
      h+='</div>';
    }
  }
  if(U.role==='admin'){
    const picks=await ensureDailyAuditPicks('admin_audit',2);
    if(picks.length){
      h+='<div class="card" style="background:var(--pri-l);border:none"><h3>🔍 你今天的私下抽查名单（只有你能看到） Your private spot-check list today (only you can see)</h3>'+
        picks.map(id=>`<span class="badge" style="margin-right:6px">${esc(stores.find(s=>s.id===id)?.store_name||'-')}</span>`).join('')+'</div>';
    }
  }
  el.innerHTML=h;
  if(allDone){
    const key='tks_confetti_'+U.id;let last=null;
    try{last=localStorage.getItem(key);}catch(e){}
    if(last!==t){try{localStorage.setItem(key,t);}catch(e){}hmConfetti();}
  }
}

let todoFilter='mine';
function renderTodoCard(t,compact=false){
  const statusLabel={open:'待认领 Open',claimed:'🔧 处理中 Working',submitted:'📝 待审核 Review',done:'✅ 已完成 Done',rejected:'↩️ 已退回 Rejected',archived:'已归档 Archived'};
  const statusCls={open:'tbadge-open',claimed:'tbadge-claimed',submitted:'tbadge-submitted',done:'tbadge-done',rejected:'tbadge-rejected',archived:'tbadge-done'};
  const isAdmin=isTop();
  const isCreator=t.created_by===U.id||isAdmin;
  const isWorker=t.claimed_by===U.id||t.assigned_to===U.id;

  let actions='';
  if(!compact){
    // Action buttons based on status
    if(t.status==='open'){
      actions+=`<button class="btn btn-ghost btn-sm" onclick="claimTodo('${t.id}')">🙋 认领 Claim</button>`;
    }
    if(t.status==='submitted'&&isCreator){
      actions+=`<button class="btn btn-ok btn-sm" onclick="approveTodo('${t.id}')">✅ 确认完成 Approve</button>`;
      actions+=`<button class="btn btn-bad btn-sm" onclick="rejectTodo('${t.id}')">↩️ 退回 Reject</button>`;
    }
    if((t.status==='done'||t.status==='archived')&&isCreator){
      // No actions for completed
    }
    if(isCreator&&!['done','archived'].includes(t.status)){
      actions+=`<button class="btn btn-ghost btn-sm" onclick="archiveTodo('${t.id}')">🗑️</button>`;
    }
  }

  // Result display
  let resultHtml='';
  if(t.result_text){
    resultHtml=`<div class="todo-result"><b>📄 处理结果 Result:</b><br>${esc(t.result_text)}</div>`;
  }
  // Reject reason display
  let rejectHtml='';
  if(t.reject_reason&&(t.status==='rejected'||t.result_text)){
    rejectHtml=`<div class="todo-reject"><b>↩️ 退回原因 Reject Reason:</b><br>${esc(t.reject_reason)}</div>`;
  }

  // Inline submit form for worker (when claimed or rejected)
  let submitForm='';
  if(!compact&&(t.status==='claimed'||t.status==='rejected')&&(isWorker||isAdmin)){
    submitForm=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <div class="fg"><label>${t.status==='rejected'?'📝 重新提交结果 Resubmit Result *':'📝 处理结果 Result * (必填)'}</label>
        <textarea id="result_${t.id}" placeholder="描述处理结果，例如：已联系XXX，报价XXX，预计XXX时间完成\nDescribe the result: who you contacted, what was agreed, next steps...">${esc(t.result_text||'')}</textarea></div>
      <button class="btn btn-pri btn-sm" onclick="submitTodo('${t.id}')">📝 提交结果 Submit Result</button>
    </div>`;
  }

  return `<div class="todo-item status-${t.status}">
    <div class="todo-header">
      <div class="todo-title">${esc(t.title)}</div>
      <span class="tbadge ${statusCls[t.status]||'tbadge-open'}">${statusLabel[t.status]||t.status}</span>
    </div>
    ${t.description?`<div class="todo-desc">${esc(t.description)}</div>`:''}
    ${t.status==='rejected'?rejectHtml:''}
    ${resultHtml}
    ${t.status!=='rejected'?rejectHtml:''}
    <div class="todo-meta">
      <span>✍️ 创建 By: ${staffName(t.created_by)}</span>
      <span>🎯 ${t.assigned_to?'指定 Assigned: '+staffName(t.assigned_to):'任何人可认领 Open'}</span>
      ${t.claimed_by?`<span>🙋 认领 Claimed: ${staffName(t.claimed_by)}</span>`:''}
      ${t.status==='done'?`<span>✅ 确认 Approved: ${staffName(t.completed_by)} ${t.completed_at?timeAgo(t.completed_at):''}</span>`:''}
      <span>🕐 ${timeAgo(t.created_at)}</span>
    </div>
    ${submitForm}
    ${compact?'':`<div class="todo-actions">${actions}</div>`}
  </div>`;
}

async function rTodos(el){
  const all=await sb.get('tks_todos','order=created_at.desc&limit=300');
  const todos=Array.isArray(all)?all:[];

  // Leaderboard
  const creatorMap={},workerMap={};
  todos.forEach(t=>{
    if(t.created_by)creatorMap[t.created_by]=(creatorMap[t.created_by]||0)+1;
    if(t.claimed_by&&t.status==='done')workerMap[t.claimed_by]=(workerMap[t.claimed_by]||0)+1;
  });
  const topC=Object.entries(creatorMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topD=Object.entries(workerMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const mine=todos.filter(t=>!['done','archived'].includes(t.status)&&(t.assigned_to===U.id||(!t.assigned_to&&t.status==='open')||t.claimed_by===U.id||(t.status==='submitted'&&(t.created_by===U.id||isTop()))));
  const open=todos.filter(t=>t.status==='open');
  const inprog=todos.filter(t=>t.status==='claimed'||t.status==='rejected');
  const submitted=todos.filter(t=>t.status==='submitted');
  const done=todos.filter(t=>t.status==='done');
  const allActive=todos.filter(t=>t.status!=='archived');

  const filterMap={mine,open,inprogress:inprog,submitted,done,all:allActive};
  const labels={mine:'我的 Mine ('+mine.length+')',open:'待认领 Open ('+open.length+')',inprogress:'处理中 Working ('+inprog.length+')',submitted:'待审核 Review ('+submitted.length+')',done:'已完成 Done ('+done.length+')',all:'全部 All ('+allActive.length+')'};
  const current=filterMap[todoFilter]||mine;

  const medals=['🥇','🥈','🥉','4️⃣','5️⃣'];
  const mkLb=(entries,max)=>entries.map(([uid,cnt],i)=>`
    <div class="leaderboard-row">
      <div class="lb-rank">${medals[i]||i+1}</div>
      <div style="flex:1"><div class="lb-name">${staffName(uid)}</div>
      <div class="lb-bar"><div class="lb-bar-fill" style="width:${max?Math.round(cnt/max*100):0}%"></div></div></div>
      <div class="lb-count">${cnt} 条 items</div>
    </div>`).join('');

  let h=`<div class="main-header"><h1>📋 待办事项 Todos</h1><p>Todo List &middot; Task Tracker</p></div>`;
  h+=`<div class="card"><h3>➕ 创建待办 Create Todo</h3>
    <div class="fg" style="margin-top:14px"><label>标题 Title *</label><input type="text" id="tdTitle" placeholder="简明描述要做的事 Brief task description..."></div>
    <div class="fg"><label>详细说明 Description (选填 Optional)</label><textarea id="tdDesc" placeholder="补充说明 More details..."></textarea></div>
    <div class="fg"><label>指定给 Assign To (选填 — 不填则所有人可认领)</label><select id="tdAssign">${staffOpts()}</select></div>
    <button class="btn btn-pri" onclick="createTodo()" style="max-width:240px">➕ 创建 Create</button>
  </div>`;

  h+='<div class="form-row">';
  h+=`<div class="card"><h3>🏆 创建最多 Top Creators</h3>${topC.length?mkLb(topC,topC[0]?.[1]):'<div style="color:var(--text3);font-size:.82rem;padding:8px 0">暂无数据 No data</div>'}</div>`;
  h+=`<div class="card"><h3>⚡ 处理最多 Top Workers</h3>${topD.length?mkLb(topD,topD[0]?.[1]):'<div style="color:var(--text3);font-size:.82rem;padding:8px 0">暂无数据 No data</div>'}</div>`;
  h+='</div>';

  h+='<div class="tab-filter">';
  for(const [k,label] of Object.entries(labels))
    h+=`<button class="tf-btn${todoFilter===k?' active':''}" onclick="setTodoFilter('${k}')">${label}</button>`;
  h+='</div>';

  if(current.length===0)h+='<div class="card" style="text-align:center;color:var(--text3);padding:32px">暂无待办 No todos here</div>';
  else h+=current.map(t=>renderTodoCard(t)).join('');
  el.innerHTML=h;
}

async function createTodo(){
  const title=document.getElementById('tdTitle').value.trim();
  if(!title){toast('请填写待办标题 Please enter a title');return}
  const d={title,description:document.getElementById('tdDesc').value.trim()||null,created_by:U.id,assigned_to:document.getElementById('tdAssign').value||null,status:'open'};
  try{
    const r=await sb.post('tks_todos',d);
    if(Array.isArray(r)&&r.length>0){
      toast('✅ 待办已创建 Todo created!');
      document.getElementById('tdTitle').value='';
      document.getElementById('tdDesc').value='';
      document.getElementById('tdAssign').value='';
      updateTodoBadge();rTodos(document.getElementById('mainBody'));
    }else toast('❌ 创建失败 Create failed: '+(r.message||JSON.stringify(r)));
  }catch(e){toast('❌ 网络错误 Network error')}
}
async function claimTodo(id){
  try{await sb.patch('tks_todos',{id},{claimed_by:U.id,claimed_at:new Date().toISOString(),status:'claimed'});

async function submitTodo(id){

async function rejectTodo(id){

async function archiveTodo(id){

/* ---- DATE HELPERS (分数看板/我的进度/订单登记在用) ---- */
function mondayOf(d){const dt=new Date(d+'T00:00:00');const day=dt.getDay();const diff=(day===0?-6:1-day);dt.setDate(dt.getDate()+diff);return fmtDate(dt);}
function addDays(d,n){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()+n);return fmtDate(dt);}

/* ---- 周度奖励规则：按店算，周一到周日 7 天都登记了总分，且周均分 ≥ 4.5，该店当周奖励 ₱100 ---- */
const REWARD_THRESHOLD=4.5,REWARD_AMOUNT=100;
function weekDatesOf(start){return [0,1,2,3,4,5,6].map(i=>addDays(start,i));}
function storeWeekStat(byStoreDate,storeId,dates){
  const vals=[];
  for(const d of dates){const sc=byStoreDate[storeId+'_'+d];if(sc&&sc.overall_score!=null)vals.push(Number(sc.overall_score));}
  const days=vals.length;
  const avg=days?Math.round(vals.reduce((a,b)=>a+b,0)/days*100)/100:null;
  const missing=dates.filter(d=>{const sc=byStoreDate[storeId+'_'+d];return !(sc&&sc.overall_score!=null);});
  const qualified=days===dates.length&&avg!=null&&avg>=REWARD_THRESHOLD;
  return {days,avg,missing,qualified,reward:qualified?REWARD_AMOUNT:0};
}
async function loadScoresByStoreDate(from,to,storeIds){
  let q='record_date=gte.'+from+'&record_date=lte.'+to;
  if(storeIds)q+='&store_id=in.('+storeIds.join(',')+')';
  let rows=await sb.get('tks_scores',q);
  if(!Array.isArray(rows))rows=[];
  const map={};rows.forEach(s=>{map[s.store_id+'_'+s.record_date]=s;});
  return map;
}
function weekStatusCell(st,isFinished){
  if(st.qualified)return '<span style="color:var(--ok);font-weight:700">✅ 达标 Qualified ₱'+REWARD_AMOUNT+'</span>';
  if(st.days<7&&isFinished)return '<span style="color:var(--bad)">❌ 漏登 Missed '+(7-st.days)+' 天 day(s)</span>';
  if(st.avg!=null&&st.avg<REWARD_THRESHOLD&&isFinished)return '<span style="color:var(--bad)">❌ 均分未到 Avg below '+REWARD_THRESHOLD+'</span>';
  return '<span style="color:var(--text3)">⏳ 进行中 In progress</span>';
}

function scoreHubNavHtml(){
  const isTop=U.role==='admin'||U.role==='S';
  const tabs=[{id:'entry',label:'📝 录入 Entry'}];
  if(!isTop)tabs.push({id:'myprogress',label:'🎯 我的进度 My Progress'});
  if(isTop)tabs.push({id:'dashboard',label:'🏆 周度看板 Dashboard'});
  return `<div class="main-header"><h1>📊 分数与奖励 Scores &amp; Rewards</h1><p>每天登记店铺分数 · Record store scores daily</p></div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">${tabs.map(t=>`<button class="btn ${scoreHubTab===t.id?'btn-pri':'btn-ghost'} btn-sm" onclick="switchScoreHub('${t.id}')">${t.label}</button>`).join('')}</div>`;
}
function switchScoreHub(id){scoreHubTab=id;rScoreHub(document.getElementById('mainBody'));}
async function rScoreHub(el){
  const isTop=U.role==='admin'||U.role==='S';
  if(scoreHubTab==='myprogress'&&isTop)scoreHubTab='entry';
  if(scoreHubTab==='dashboard'&&!isTop)scoreHubTab='entry';
  if(scoreHubTab==='entry')await rScore(el);
  else if(scoreHubTab==='myprogress')await rMyProgress(el);
  else if(scoreHubTab==='dashboard')await rDashboard(el);
}

/* ---- SCORES ---- */
async function rScore(el){
  const allScores=await sb.get('tks_scores','order=record_date.desc&limit=200');
  const latest={},prev={};if(Array.isArray(allScores))allScores.forEach(s=>{if(!latest[s.store_id])latest[s.store_id]=s;else if(!prev[s.store_id])prev[s.store_id]=s});
  let h=scoreHubNavHtml();
  // 待补截图提醒（只看自己名下店铺，被抽中且还没传截图的）
  if(!isTop()){
    const myIds=myStores().map(s=>s.id);
    const pending=(Array.isArray(allScores)?allScores:[]).filter(s=>myIds.includes(s.store_id)&&s.audit_flagged_at&&!s.audit_image_url&&!s.audit_resolved);
    if(pending.length){
      h+='<div class="card" style="background:#fff7ed;border:1px solid #fdba74"><h3>📸 今天有店铺被抽中核查，请补一张后台截图 A store was picked for check today, please upload a backend screenshot</h3>';
      for(const p of pending){const st=stores.find(x=>x.id===p.store_id);
        h+=`<div style="display:flex;align-items:center;gap:10px;margin-top:8px">
          <b>${esc(st?.store_name||'-')}</b>（${p.record_date}）
          <input type="file" accept="image/*" onchange="uploadAuditScreenshot('${p.store_id}','${p.record_date}',this)">
        </div>`;
      }
      h+='</div>';
    }
  }
  if(Object.keys(latest).length>0){
    h+='<div class="card"><h3>📈 全部店铺最新分数 All Stores Latest</h3><table class="score-table" style="margin-top:12px"><thead><tr><th>店铺 Store</th><th>负责人 Owner</th><th>总分 Overall</th><th>趋势 Trend</th><th>产品 Product 70%</th><th>物流 Fulfill 15%</th><th>客服 Service 15%</th><th>差评 Neg. %</th><th>12H%</th><th>日期 Date</th></tr></thead><tbody>';
    const visibleStores=isTop()?stores:myStores();
    const ranked=visibleStores.filter(s=>latest[s.id]).sort((a,b)=>(latest[b.id].overall_score??-1)-(latest[a.id].overall_score??-1));
    for(const s of ranked){const sc=latest[s.id];const pv=prev[s.id];
      h+=`<tr><td><b>${esc(s.store_name)}</b></td><td>${s.assigned_to?staffName(s.assigned_to):'<span style="color:var(--text3)">未指派 Unassigned</span>'}</td><td class="${sColor(sc.overall_score)}"><b>${sc.overall_score??'-'}</b></td>
        <td>${pv?trend(sc.overall_score,pv.overall_score):'—'}</td>
        <td class="${sColor(sc.product_satisfaction)}">${sc.product_satisfaction??'-'}${pv?trend(sc.product_satisfaction,pv.product_satisfaction):''}</td>
        <td class="${sColor(sc.fulfillment)}">${sc.fulfillment??'-'}${pv?trend(sc.fulfillment,pv.fulfillment):''}</td>
        <td class="${sColor(sc.customer_service)}">${sc.customer_service??'-'}${pv?trend(sc.customer_service,pv.customer_service):''}</td>
        <td>${sc.negative_review_rate??'-'}</td><td>${sc.response_rate_12h??'-'}</td>
        <td style="color:var(--text3)">${sc.record_date?.slice(5)}</td></tr>`}
    h+='</tbody></table></div>';}
  h+=`<div class="card"><h3>➕ 录入分数 Record Score</h3>
    <div class="form-row" style="margin-top:16px">
      <div class="fg"><label>店铺 Store *</label><select id="scStore" onchange="loadHistory()">${isTop()?storeOpts():myStoreOpts()}</select></div>
      <div class="fg"><label>日期 Date${isTop()?'':' <span style="font-weight:400;text-transform:none;color:var(--text3)">（只能登记今天，不能补登 Today only, no backfilling）</span>'}</label><input type="date" id="scDate" value="${today()}"${isTop()?'':' disabled'}></div>
    </div>
    <div class="sec-title">主要分数 Main Scores (0-5)</div>
    <div class="form-row-4">
      <div class="fg"><label>总分 Overall</label><input type="number" id="sO" min="0" max="5" step="0.1" placeholder="2.4"></div>
      <div class="fg"><label>产品 Product</label><input type="number" id="sP" min="0" max="5" step="0.1" oninput="calcSc()"></div>
      <div class="fg"><label>物流 Fulfill</label><input type="number" id="sF" min="0" max="5" step="0.1" oninput="calcSc()"></div>
      <div class="fg"><label>客服 Service</label><input type="number" id="sS" min="0" max="5" step="0.1" oninput="calcSc()"></div>
    </div>
    <div class="calc-box" id="calcBox">填入三项分数自动计算 Auto-calculates from 3 scores</div>
    <button class="btn btn-pri" onclick="saveSc()" style="margin-top:16px;max-width:300px">💾 保存分数 Save Score</button>
  </div><div id="scoreHist"></div>`;
  el.innerHTML=h;
}
function calcSc(){
  const p=parseFloat(document.getElementById('sP').value)||0,f=parseFloat(document.getElementById('sF').value)||0,s=parseFloat(document.getElementById('sS').value)||0;
  if(p||f||s){const c=(p*.70+f*.15+s*.15).toFixed(1);
    document.getElementById('calcBox').innerHTML='公式 Formula: <b>'+p+'</b>×70% + <b>'+f+'</b>×15% + <b>'+s+'</b>×15% = <b style="font-size:1.1em">'+c+'</b>';
    if(!document.getElementById('sO').value)document.getElementById('sO').value=c;}
}
async function saveSc(){
  const sid=document.getElementById('scStore').value;if(!sid){toast('请选择店铺 Please select a store');return}
  const date=document.getElementById('scDate').value||today();
  if(!isTop()&&date!==today()){toast('只能登记今天的分数，不能补登 You can only record today\'s score');return}
  const newScore=parseFloat(document.getElementById('sO').value)||null;
  // 已有记录且分数变了 → 记一条修改留痕（客服自己看不到，admin/S能看）
  try{
    const existingArr=await sb.get('tks_scores','store_id=eq.'+sid+'&record_date=eq.'+date);
    if(Array.isArray(existingArr)&&existingArr.length>0){
      const old=existingArr[0];
      if(old.overall_score!=null&&newScore!=null&&Number(old.overall_score)!==Number(newScore)){
        await sb.rpc('tks_log_score_edit',{p_user_id:U.id,p_store_id:sid,p_record_date:date,p_old_score:old.overall_score,p_new_score:newScore});
      }
    }
  }catch(e){}
  const d={store_id:sid,record_date:date,
    overall_score:newScore,
    product_satisfaction:parseFloat(document.getElementById('sP').value)||null,
    fulfillment:parseFloat(document.getElementById('sF').value)||null,
    customer_service:parseFloat(document.getElementById('sS').value)||null,
    recorded_by:U.id};
  try{const r=await sb.upsertOn('tks_scores','store_id,record_date',d);
    if(Array.isArray(r)&&r.length>0){
      toast('✅ 分数已保存 Score saved!');
      await maybeFlagAudit(sid,date);
      rScore(document.getElementById('mainBody'));
    }
    else toast('❌ 保存失败 Save failed: '+(r.message||''));
  }catch(e){toast('❌ 网络错误 Network error')}
}
async function ensureDailyAuditPicks(kind,count){
  const d=today();
  let existing=await sb.get('tks_score_audit_picks','pick_date=eq.'+d+'&kind=eq.'+kind);
  if(Array.isArray(existing)&&existing.length>0)return existing.map(x=>x.store_id);
  const pool=stores.filter(s=>s.assigned_to);
  const shuffled=[...pool].sort(()=>Math.random()-0.5);
  const picks=shuffled.slice(0,Math.min(count,shuffled.length));
  if(picks.length){await sb.post('tks_score_audit_picks',picks.map(s=>({pick_date:d,store_id:s.id,kind})));}
  return picks.map(s=>s.id);
}
async function maybeFlagAudit(storeId,date){
  const picks=await ensureDailyAuditPicks('staff_audit',2);
  if(picks.includes(storeId)){
    await sb.patch('tks_scores',{store_id:storeId,record_date:date},{audit_flagged_at:new Date().toISOString()});
    toast('📸 这家店今天被抽中核查，请补一张后台截图 This store was picked for check, please upload a screenshot below');
  }
}
async function uploadAuditScreenshot(storeId,date,inputEl){
  if(!inputEl.files||!inputEl.files[0])return;
  toast('📤 上传中... Uploading...');
  try{
    const url=await uploadImage(inputEl.files[0],'score_audit');
    await sb.patch('tks_scores',{store_id:storeId,record_date:date},{audit_image_url:url});
    toast('✅ 截图已上传 Screenshot uploaded');
    rScore(document.getElementById('mainBody'));
  }catch(e){toast('❌ 上传失败 Upload failed: '+e.message);}
}
async function resolveAudit(storeId,date){
  await sb.patch('tks_scores',{store_id:storeId,record_date:date},{audit_resolved:true,audit_resolved_by:U.id,audit_resolved_at:new Date().toISOString()});
  toast('✅ 已标记通过 Marked as verified');
  go('home');
}
async function loadHistory(){
  const sid=document.getElementById('scStore').value;const c=document.getElementById('scoreHist');
  if(!sid){c.innerHTML='';return}
  const sc=await sb.get('tks_scores','store_id=eq.'+sid+'&order=record_date.desc&limit=30');
  if(!Array.isArray(sc)||!sc.length){c.innerHTML='<div class="card" style="text-align:center;color:var(--text3)">暂无记录 No records yet</div>';return}
  const sn=stores.find(s=>s.id===sid);
  let h='<div class="sec-title">📈 历史分数 Score History — '+(sn?esc(sn.store_name):'')+'</div><div class="card"><table class="score-table"><thead><tr><th>日期 Date</th><th>总分 Overall</th><th>产品 Product</th><th>物流 Fulfill</th><th>客服 Service</th><th>差评 Neg. %</th><th>12H%</th></tr></thead><tbody>';
  for(let i=0;i<sc.length;i++){const s=sc[i];const p=sc[i+1]||null;
    h+=`<tr><td>${s.record_date}</td>
      <td class="${sColor(s.overall_score)}"><b>${s.overall_score??'-'}</b>${p?trend(s.overall_score,p.overall_score):''}</td>
      <td class="${sColor(s.product_satisfaction)}">${s.product_satisfaction??'-'}${p?trend(s.product_satisfaction,p.product_satisfaction):''}</td>
      <td class="${sColor(s.fulfillment)}">${s.fulfillment??'-'}${p?trend(s.fulfillment,p.fulfillment):''}</td>
      <td class="${sColor(s.customer_service)}">${s.customer_service??'-'}${p?trend(s.customer_service,p.customer_service):''}</td>
      <td>${s.negative_review_rate??'-'}${p?trend(s.negative_review_rate,p.negative_review_rate):''}</td>
      <td>${s.response_rate_12h??'-'}${p?trend(s.response_rate_12h,p.response_rate_12h):''}</td></tr>`}
  h+='</tbody></table></div>';c.innerHTML=h;
}

/* ---- MY PROGRESS (staff) ---- */
async function rMyProgress(el){
  const myStoreIds=myStores().map(s=>s.id);
  let h=scoreHubNavHtml();
  if(!myStoreIds.length){h+='<div class="card">暂无指派给你的店铺，找 admin 分配 · No stores assigned to you, please ask admin</div>';el.innerHTML=h;return}
  const weekStart=mondayOf(today());
  const thisWeek=weekDatesOf(weekStart),lastWeek=weekDatesOf(addDays(weekStart,-7));
  const byStoreDate=await loadScoresByStoreDate(lastWeek[0],thisWeek[6],myStoreIds);
  const t=today();
  const pastDays=thisWeek.filter(d=>d<=t);
  let lastTotal=0;
  h+=`<div class="card" style="background:var(--pri-l);border:none;font-size:.85rem">📌 奖励规则：每家店<b>周一到周日 7 天都要登记</b>总分，周均分 <b>≥ ${REWARD_THRESHOLD}</b>，这家店当周奖励 <b>₱${REWARD_AMOUNT}</b>。漏登一天，这家店当周就没有奖励。<br><span style="color:var(--text3);font-size:.9em">Reward rule: each store must record the score <b>all 7 days (Mon–Sun)</b>. If the weekly average is <b>≥ ${REWARD_THRESHOLD}</b>, that store earns <b>₱${REWARD_AMOUNT}</b> for the week. Missing even one day = no reward for that store that week.</span></div>`;
  h+=`<div class="sec-title">📅 本周进度 This Week ${thisWeek[0]} ~ ${thisWeek[6]}</div><div class="card"><table class="score-table"><thead><tr><th>店铺 Store</th><th>已登记 Recorded</th><th>目前均分 Avg so far</th><th>提醒 Note</th></tr></thead><tbody>`;
  for(const sid of myStoreIds){
    const s=stores.find(x=>x.id===sid);
    const st=storeWeekStat(byStoreDate,sid,thisWeek);
    const missedSoFar=st.missing.filter(d=>d<=t);
    let tip;
    if(missedSoFar.length)tip=`<span style="color:var(--bad)">⚠️ 漏登：${missedSoFar.map(d=>d.slice(5)).join('、')}，本周这家店已没有奖励资格 · Missed day(s), no reward this week</span>`;
    else if(st.avg!=null&&st.avg<REWARD_THRESHOLD)tip=`<span style="color:#c2410c">目前均分低于 Below ${REWARD_THRESHOLD}，还差 need +${(REWARD_THRESHOLD-st.avg).toFixed(2)}</span>`;
    else if(st.avg!=null)tip='<span style="color:var(--ok)">👍 保持住，每天都要登记 Keep it up, record every day</span>';
    else tip='<span style="color:var(--text3)">本周还没登记 Not recorded yet</span>';
    h+=`<tr><td><b>${esc(s?.store_name||'-')}</b></td><td>${st.days}/${pastDays.length} 天 days</td><td class="${sColor(st.avg)}">${st.avg!=null?st.avg.toFixed(2):'-'}</td><td style="font-size:.8rem">${tip}</td></tr>`;
  }
  h+='</tbody></table></div>';
  h+=`<div class="sec-title">🏁 上周结果 Last Week ${lastWeek[0]} ~ ${lastWeek[6]}</div><div class="card"><table class="score-table"><thead><tr><th>店铺 Store</th><th>登记天数 Days</th><th>周均分 Weekly Avg</th><th>结果 Result</th></tr></thead><tbody>`;
  for(const sid of myStoreIds){
    const s=stores.find(x=>x.id===sid);
    const st=storeWeekStat(byStoreDate,sid,lastWeek);lastTotal+=st.reward;
    h+=`<tr><td><b>${esc(s?.store_name||'-')}</b></td><td>${st.days}/7</td><td class="${sColor(st.avg)}">${st.avg!=null?st.avg.toFixed(2):'-'}</td><td>${weekStatusCell(st,true)}</td></tr>`;
  }
  h+=`<tr><td colspan="3"><b>上周奖励合计 Last week total</b></td><td><b style="color:var(--ok)">₱${lastTotal}</b></td></tr></tbody></table></div>`;
  el.innerHTML=h;
}

/* ---- WEEKLY DASHBOARD (S/admin) ---- */
// 周一默认看上周（发钱用），其他日子默认看本周
let dashWeekStart=new Date().getDay()===1?addDays(mondayOf(today()),-7):mondayOf(today()),riskThreshold=3.0;
async function rDashboard(el){
  if(!(U.role==='admin'||U.role==='S')){el.innerHTML='<div class="card">🚫 无权限访问 Access denied</div>';return}
  const weekDates=weekDatesOf(dashWeekStart),lastWeekDates=weekDatesOf(addDays(dashWeekStart,-7));
  const t=today(),isFinished=weekDates[6]<t;
  let h=scoreHubNavHtml()+`<p style="color:var(--text3);font-size:.85rem;margin-bottom:12px">规则：按店算，周一到周日 7 天都登记总分，且周均分 ≥ ${REWARD_THRESHOLD}，该店当周奖励 ₱${REWARD_AMOUNT}；漏登一天当周该店无奖励。<br><span style="color:var(--text3);font-size:.9em">Rule: per store. Record all 7 days (Mon–Sun) and weekly avg ≥ ${REWARD_THRESHOLD} → ₱${REWARD_AMOUNT} for that store. Missing one day = no reward.</span></p>`;
  h+=`<div class="card" style="display:flex;align-items:center;justify-content:space-between">
    <button class="btn btn-ghost btn-sm" onclick="shiftDashWeek(-7)">← 上一周 Prev</button>
    <b>${weekDates[0]} ~ ${weekDates[6]} ${isFinished?'<span class="badge badge-staff">已结束 Finished</span>':'<span class="badge">进行中 In progress</span>'}</b>
    <button class="btn btn-ghost btn-sm" onclick="shiftDashWeek(7)">下一周 Next →</button>
  </div>`;
  const byStoreDate=await loadScoresByStoreDate(lastWeekDates[0],weekDates[6]);

  // 每家店本周结果
  const rows=stores.map(s=>({store:s,st:storeWeekStat(byStoreDate,s.id,weekDates)}));
  h+='<div class="sec-title">🏪 各店本周结果 Store Results</div><div class="card"><table class="score-table"><thead><tr><th>店铺 Store</th><th>负责人 Owner</th><th>登记天数 Days</th><th>周均分 Weekly Avg</th><th>漏登日期 Missed</th><th>结果 Result</th></tr></thead><tbody>';
  for(const r of rows){
    const missedSoFar=r.st.missing.filter(d=>d<=t);
    h+=`<tr><td><b>${esc(r.store.store_name)}</b></td><td>${r.store.assigned_to?staffName(r.store.assigned_to):'<span style="color:var(--text3)">未指派 Unassigned</span>'}</td>
      <td>${r.st.days}/7</td><td class="${sColor(r.st.avg)}"><b>${r.st.avg!=null?r.st.avg.toFixed(2):'-'}</b></td>
      <td style="font-size:.78rem;color:var(--bad)">${missedSoFar.map(d=>d.slice(5)).join('、')||'—'}</td>
      <td>${weekStatusCell(r.st,isFinished)}</td></tr>`;
  }
  if(!rows.length)h+='<tr><td colspan="6" style="text-align:center;color:var(--text3)">暂无店铺 No stores</td></tr>';
  h+='</tbody></table></div>';

  // 按负责人汇总：发钱用
  const pay={};
  for(const r of rows){
    const uid=r.store.assigned_to;if(!uid)continue;
    if(!pay[uid])pay[uid]={stores:0,ok:0,total:0,names:[]};
    pay[uid].stores++;
    if(r.st.qualified){pay[uid].ok++;pay[uid].total+=r.st.reward;pay[uid].names.push(r.store.store_name);}
  }
  const grand=Object.values(pay).reduce((a,p)=>a+p.total,0);
  h+=`<div class="sec-title">💰 本周应发奖励（按负责人） Rewards to Pay (by owner)${isFinished?'':'<span style="font-weight:400;text-transform:none;color:var(--text3)"> · 本周未结束，仅供参考 Week not finished, for reference only</span>'}</div><div class="card"><table class="score-table"><thead><tr><th>负责人 Owner</th><th>达标店铺 Qualified Stores</th><th>应发 To Pay</th></tr></thead><tbody>`;
  for(const uid in pay){const p=pay[uid];
    h+=`<tr><td><b>${esc(staffName(uid))}</b></td><td>${p.ok}/${p.stores}${p.names.length?' <span style="font-size:.75rem;color:var(--text3)">（'+p.names.map(esc).join('、')+'）</span>':''}</td><td><b>₱${p.total}</b></td></tr>`;
  }
  if(!Object.keys(pay).length)h+='<tr><td colspan="3" style="text-align:center;color:var(--text3)">暂无已指派店铺 No assigned stores</td></tr>';
  h+=`<tr><td colspan="2"><b>合计 Total</b></td><td><b style="color:var(--ok)">₱${grand}</b></td></tr></tbody></table></div>`;

  // 危险店铺预警（连续两周均分低于阈值，普通平均）
  h+=`<div class="sec-title">⚠️ 危险店铺预警（连续两周均分低于阈值） At-Risk Stores (2 weeks below threshold)</div><div class="card">
    <div style="margin-bottom:10px"><label style="font-size:.82rem">预警阈值 Threshold</label> <input type="number" step="0.1" id="riskThresholdInput" value="${riskThreshold}" style="width:80px" onchange="riskThreshold=parseFloat(this.value)||3.0;rDashboard(document.getElementById('mainBody'))"></div>`;
  const atRisk=stores.map(s=>({store:s,thisW:storeWeekStat(byStoreDate,s.id,weekDates).avg,lastW:storeWeekStat(byStoreDate,s.id,lastWeekDates).avg}))
    .filter(m=>m.thisW!=null&&m.lastW!=null&&m.thisW<riskThreshold&&m.lastW<riskThreshold);
  if(atRisk.length){
    h+='<table class="score-table"><thead><tr><th>店铺 Store</th><th>负责人 Owner</th><th>上周 Last Week</th><th>本周 This Week</th></tr></thead><tbody>';
    for(const m of atRisk)h+=`<tr style="color:var(--bad)"><td><b>${esc(m.store.store_name)}</b></td><td>${m.store.assigned_to?staffName(m.store.assigned_to):'-'}</td><td>${m.lastW.toFixed(2)}</td><td>${m.thisW.toFixed(2)}</td></tr>`;
    h+='</tbody></table>';
  }else h+='<div style="color:var(--text3);text-align:center;padding:10px">暂无连续两周低于阈值的店铺 No at-risk stores 👍</div>';
  h+='</div>';

  // 数据完整率：截至今天应登记的天数 vs 实际登记
  const dueDates=weekDates.filter(d=>d<=t);
  const totalSlots=stores.length*dueDates.length;let filled=0;
  for(const s of stores)for(const d of dueDates){const sc=byStoreDate[s.id+'_'+d];if(sc&&sc.overall_score!=null)filled++;}

  }else{
    h+='<table class="score-table"><thead><tr><th>店铺 Store</th><th>日期 Date</th><th>改前 Before</th><th>改后 After</th><th>改的人 By</th><th>时间 Time</th></tr></thead><tbody>';
    for(const l of editLog.slice(0,30)){

      h+=`<tr><td><b>${esc(st?.store_name||'-')}</b></td><td>${l.record_date}</td>

        <td style="font-size:.75rem;color:var(--text3)">${new Date(l.edited_at).toLocaleString()}</td></tr>`;

}

// 一次请求拿到最近消息 + 我的已读记录，算出每个聊天的未读数
async function fetchChatState(limit){
  let msgs=[],rs=[];
  try{msgs=await sb.get('tks_messages','select=id,channel_key,sender_id,message,created_at,deleted_at&order=created_at.desc&limit='+limit);if(!Array.isArray(msgs))msgs=[];}catch(e){msgs=[];}
  try{rs=await sb.get('tks_read_status','user_id=eq.'+U.id);if(!Array.isArray(rs))rs=[];}catch(e){rs=[];}
  const readMap={};
  rs.forEach(r=>{const t=new Date(r.last_read_at);if(!readMap[r.channel_key]||t>readMap[r.channel_key])readMap[r.channel_key]=t;});
  const unread={};
  msgs.forEach(m=>{
    if(m.sender_id===U.id||m.deleted_at)return;
    if(new Date(m.created_at)>(readMap[m.channel_key]||new Date(0)))unread[m.channel_key]=(unread[m.channel_key]||0)+1;
  });
  return {msgs,unread};
}
function isMyChannel(key){return key==='general'||(key.startsWith('dm_')&&key.replace('dm_','').split('_').includes(U.id))}

async function rChat(el){
  const isAdmin=isTop();
  const {msgs:allMsgs,unread}=await fetchChatState(500);

  const channels=new Map();
  channels.set('general',{key:'general',name:'📢 总群 General',lastMsg:null,unread:0,type:'group'});
  allMsgs.forEach(m=>{
    if(!channels.has(m.channel_key)&&m.channel_key.startsWith('dm_')){
      const ids=m.channel_key.replace('dm_','').split('_');
      const isMine=ids.includes(U.id);
      if(isMine||isAdmin){
        const otherName=ids.filter(i=>i!==U.id).map(chatPersonName).join(' & ');
        channels.set(m.channel_key,{key:m.channel_key,name:(isMine?'👤 ':'👥 ')+otherName,lastMsg:null,unread:0,type:isMine?'dm':'staff_dm'});
      }
    }
    const ch=channels.get(m.channel_key);
    if(ch&&!ch.lastMsg)ch.lastMsg=m;
  });
  channels.forEach((ch,key)=>{ch.unread=unread[key]||0;});
  staffList.filter(s=>s.is_active&&s.id!==U.id).forEach(s=>{
    const dk=dmKey(U.id,s.id);
    if(!channels.has(dk))channels.set(dk,{key:dk,name:'👤 '+s.display_name,lastMsg:null,unread:0,type:'dm'});
  });

  const sorted=[...channels.values()];
  const byLast=(a,b)=>(b.lastMsg?.created_at||'')>(a.lastMsg?.created_at||'')?1:-1;
  const general=sorted.find(c=>c.key==='general');
  const myDms=sorted.filter(c=>c.type==='dm').sort(byLast);
  const staffDms=sorted.filter(c=>c.type==='staff_dm').sort(byLast);
  if(!channels.has(chatChannel))chatChannel='general';

  let convHtml='';
  if(general)convHtml+=mkConv(general);
  if(myDms.length)convHtml+='<div class="chat-sec">── 私聊 My DMs ──</div>';
  myDms.forEach(c=>{convHtml+=mkConv(c)});
  if(isAdmin&&staffDms.length){
    convHtml+='<div class="chat-sec">── 员工私聊 Staff DMs ──</div>';
    staffDms.forEach(c=>{convHtml+=mkConv(c)});
  }

  el.innerHTML=`<div class="chat-wrap">
    <div class="chat-list">
      <div class="chat-list-header">💬 聊天 Chat</div>
      <div class="chat-list-body">${convHtml}</div>
    </div>
    <div class="chat-main">
      <div class="chat-main-header" id="chatHeader">${esc(channelName(chatChannel))}</div>
      <div class="chat-messages" id="chatMsgs"></div>
      ${canSendIn(chatChannel)?chatInputHtml():CHAT_VIEWONLY_HTML}
    </div>
  </div>`;
  chatLastSig='';chatStickBottom=true;
  await loadChatMessages();
  refreshChatUnread();
  startChatPoll();
}

function canSendIn(key){
  if(key==='general')return true;
  if(!key.startsWith('dm_'))return false;
  return key.replace('dm_','').split('_').includes(U.id);
}

function mkConv(c){
  const preview=c.lastMsg?(c.lastMsg.deleted_at?'[已撤回 Withdrawn]':esc(chatPreviewText(c.lastMsg)).slice(0,30)):'';
  return `<div class="chat-conv${c.key===chatChannel?' active':''}" data-key="${c.key}" onclick="switchChannel('${c.key}')">
    <div class="chat-conv-info"><div class="chat-conv-name">${esc(c.name)}</div>${preview?`<div class="chat-conv-preview">${preview}</div>`:''}</div>
    ${c.unread>0?`<span class="chat-unread">${c.unread}</span>`:''}</div>`;
}

async function switchChannel(key){
  chatChannel=key;
  const header=document.getElementById('chatHeader');
  if(header)header.textContent=channelName(key);
  document.querySelectorAll('.chat-conv').forEach(el=>el.classList.toggle('active',el.dataset.key===key));
  const chatMain=document.querySelector('.chat-main');
  if(chatMain){
    const bar=chatMain.querySelector('.chat-input,.chat-input-viewonly');
    if(bar)bar.outerHTML=canSendIn(key)?chatInputHtml():CHAT_VIEWONLY_HTML;
  }
  const c=document.getElementById('chatMsgs');if(c)c.innerHTML='';
  chatLastSig='';chatStickBottom=true; // 切换后一定跳到最新消息
  await loadChatMessages();
  refreshChatUnread();
}

async function loadChatMessages(){
  const container=document.getElementById('chatMsgs');
  if(!container)return;
  const key=chatChannel;
  let msgs=[];
  // 取最新的 200 条（倒序取，再翻回正序显示）
  try{msgs=await sb.get('tks_messages','channel_key=eq.'+encodeURIComponent(key)+'&order=created_at.desc&limit=200');if(!Array.isArray(msgs))msgs=[];}catch(e){return;}
  if(key!==chatChannel)return; // 请求回来时已经切到别的聊天了
  msgs.reverse();
  // 看到了就算已读
  if(msgs.length&&!document.hidden)await markRead(key,msgs[msgs.length-1].created_at);
  const sig=key+'|'+msgs.length+'|'+(msgs.length?msgs[msgs.length-1].id:'')+'|'+msgs.filter(m=>m.deleted_at).length;
  if(sig===chatLastSig)return; // 没有新内容，不重画
  chatLastSig=sig;
  if(!msgs.length){container.innerHTML='<div class="chat-empty">暂无消息<br>No messages yet</div>';return;}
  const isAdmin=isTop();
  let h='';let lastDate='';
  for(const m of msgs){
    const d=formatDate(m.created_at);
    if(d!==lastDate){lastDate=d;h+=`<div class="chat-date-sep">${d}</div>`;}
    const mine=m.sender_id===U.id;
    const isDeleted=!!m.deleted_at;
    const img=chatImgUrl(m);
    let bubbleContent,bubbleClass='cm-bubble';
    if(isDeleted&&!isAdmin){bubbleContent='[已撤回 Message withdrawn]';bubbleClass+=' cm-deleted';}
    else{
      bubbleContent=img?`<a href="${esc(img)}" target="_blank"><img class="cm-img" src="${esc(img)}" loading="lazy" alt="photo"></a>`:esc(m.message);
      if(img)bubbleClass+=' cm-bubble-img';
      if(isDeleted)bubbleClass+=' cm-deleted-admin';
    }
    const canDel=!isDeleted&&(mine||isAdmin);
    h+=`<div class="chat-msg ${mine?'mine':'other'}">
      <div class="cm-name">${mine?'You 你':esc(chatPersonName(m.sender_id))}</div>
      <div class="${bubbleClass}">${bubbleContent}</div>
      <div class="cm-time">${formatTime(m.created_at)}${canDel?` <span class="cm-del" onclick="deleteMsg('${m.id}')" title="撤回 Delete">🗑️</span>`:''}</div>
    </div>`;
  }
  const stick=chatStickBottom||container.scrollHeight-container.scrollTop-container.clientHeight<50;
  chatStickBottom=false;
  container.innerHTML=h;
  if(stick){
    container.scrollTop=container.scrollHeight;
    container.querySelectorAll('img.cm-img').forEach(i=>i.addEventListener('load',()=>{container.scrollTop=container.scrollHeight},{once:true}));
  }
}

async function sendMsg(){
  const input=document.getElementById('chatInput');
  if(!input)return;
  const msg=input.value.trim();
  if(!msg)return;
  input.value='';
  await postChatMessage(msg,()=>{input.value=msg;});
}
async function postChatMessage(text,onFail){
  try{
    const r=await sb.post('tks_messages',{channel_key:chatChannel,sender_id:U.id,message:text});
    if(!Array.isArray(r))throw new Error('post failed');
    chatStickBottom=true;
    await loadChatMessages();
    refreshChatUnread();
  }catch(e){toast('❌ 发送失败 Send failed');if(onFail)onFail();}
}
async function sendChatImage(file){
  if(!file||!file.type||!file.type.startsWith('image/'))return;
  if(chatSending)return;
  chatSending=true;
  toast('📤 图片上传中... Uploading photo...');
  try{
    const url=await uploadImage(file,'chat'); // 已自动压缩到 1000px 以内
    await postChatMessage(CHAT_IMG_PREFIX+url);
  }catch(e){toast('❌ 图片上传失败 Photo upload failed');}
  chatSending=false;
}
function chatPaste(e){
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of items){
    if(it.kind==='file'&&it.type.startsWith('image/')){e.preventDefault();sendChatImage(it.getAsFile());return;}
  }
}

async function deleteMsg(id){
  if(!confirm('撤回这条消息？\nWithdraw this message?'))return;
  try{
    await sb.patch('tks_messages',{id},{deleted_at:new Date().toISOString(),deleted_by:U.id});
    await loadChatMessages();
  }catch(e){toast('❌ 操作失败 Failed');}
}

// 已读记录：先更新，没有就新增（不依赖数据库唯一约束）。用服务器上的消息时间，避免电脑时钟不准
const chatReadMarked={};
async function markRead(key,upTo){
  if(!upTo||chatReadMarked[key]===upTo)return;
  try{
    const r=await sb.patch('tks_read_status',{user_id:U.id,channel_key:key},{last_read_at:upTo});
    if(!Array.isArray(r)||!r.length)await sb.post('tks_read_status',{user_id:U.id,channel_key:key,last_read_at:upTo});
    chatReadMarked[key]=upTo;
  }catch(e){}
}

function startChatPoll(){
  stopChatPoll();
  chatPollTimer=setInterval(async()=>{
    if(currentTab!=='chat')return;
    if(!document.hidden)await loadChatMessages(); // 窗口在后台时不刷消息，只查未读（用于提醒）
    refreshChatUnread();
  },5000);
}
function stopChatPoll(){if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null;}}

// 一次请求同时更新：聊天列表红点 + 左侧菜单红点 + 提醒
async function refreshChatUnread(){
  const {msgs,unread}=await fetchChatState(300);
  document.querySelectorAll('.chat-conv').forEach(el=>{
    const n=unread[el.dataset.key]||0;
    const existing=el.querySelector('.chat-unread');
    if(n>0){
      if(existing)existing.textContent=n;
      else{const span=document.createElement('span');span.className='chat-unread';span.textContent=n;el.appendChild(span);}
    }else if(existing)existing.remove();
  });
  applyChatBadge(msgs,unread);
}
function applyChatBadge(msgs,unread){
  let total=0;
  for(const k in unread)if(isMyChannel(k))total+=unread[k];
  if(total>lastKnownUnread){
    const newestMsg=msgs.find(m=>m.sender_id!==U.id&&!m.deleted_at&&isMyChannel(m.channel_key)&&unread[m.channel_key]);
    if(newestMsg){
      showDesktopNotif('💬 '+chatPersonName(newestMsg.sender_id),chatPreviewText(newestMsg).slice(0,80));
      playNotifSound();
    }
  }
  lastKnownUnread=total;
  chatUnreadTotal=total;
  const nav=document.getElementById('nav_chat');
  if(nav){const ex=nav.querySelector('.nav-badge');if(ex)ex.remove();
    if(total>0)nav.insertAdjacentHTML('beforeend','<span class="nav-badge">'+total+'</span>');}
  document.title=total>0?'('+total+') TK Store Manager':'TK Store Manager';
}
// 不在聊天页时，每 10 秒查一次未读（在聊天页时由上面的轮询负责，避免重复请求）
async function updateChatBadge(){
  if(chatPollTimer&&currentTab==='chat')return;
  const {msgs,unread}=await fetchChatState(200);
  applyChatBadge(msgs,unread);
}

// ---- NOTIFICATIONS ----
function requestNotifPermission(){
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }
}
function showDesktopNotif(title,body){
  if('Notification' in window&&Notification.permission==='granted'){
    try{const n=new Notification(title,{body:body,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🏪</text></svg>'});
      n.onclick=()=>{window.focus();go('chat');n.close()};
      setTimeout(()=>n.close(),10000);
    }catch(e){}
  }
}
function playNotifSound(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;osc.type='sine';
    gain.gain.setValueAtTime(0.3,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3);
    osc.start();osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

/* ---- STORES ---- */
async function rStores(el){
  await loadData();
  if(U.role!=='admin'&&U.role!=='S'){
    // 普通员工只读视图：只看店铺名单，不能管理
    let hv=`<div class="main-header"><h1>🏪 店铺列表 Stores</h1><p>Store List（只读 read-only）</p></div>
      <div class="card"><table class="score-table"><thead><tr><th>店铺名称 Store Name</th><th>类目 Category</th></tr></thead><tbody>
      ${stores.map(s=>`<tr><td><b>${esc(s.store_name)}</b></td><td>${esc(s.category||'—')}</td></tr>`).join('')}
      </tbody></table></div>`;
    el.innerHTML=hv;return;
  }
  let h=`<div class="main-header"><h1>🏪 店铺管理 Stores</h1><p>Store Management</p></div>
    <div class="card"><h3>➕ 添加店铺 Add Store</h3>
      <div class="form-row" style="margin-top:14px">
        <div class="fg"><label>店铺名称 Store Name *</label><input type="text" id="newSName"></div>
        <div class="fg"><label>类目 Category</label><input type="text" id="newSCat"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>负责人 Assigned To</label><select id="newSAssign">${staffOpts()}</select></div>
        <div class="fg" style="display:flex;align-items:flex-end"><button class="btn btn-pri" onclick="addStore()">➕ 添加 Add</button></div>
      </div>
    </div>
    <div class="sec-title">店铺列表 Store List (${stores.length})</div><div class="card">
    <table class="score-table"><thead><tr><th>店铺名称 Store Name</th><th>类目 Category</th><th>负责人 Owner</th><th>操作 Actions</th></tr></thead><tbody>`;
  for(const s of stores){
    h+=`<tr><td><b>${esc(s.store_name)}</b></td><td>${esc(s.category||'—')}</td>
      <td><select onchange="assignStore('${s.id}',this.value)" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:.8rem">${staffOpts(s.assigned_to||'')}</select></td>
      <td><button class="btn btn-ghost btn-sm" onclick="delStore('${s.id}','${esc(s.store_name)}')">🗑️</button></td></tr>`}
  h+='</tbody></table></div>';el.innerHTML=h;
}
async function addStore(){
  const n=document.getElementById('newSName').value.trim();if(!n){toast('请输入店铺名称 Please enter store name');return}
  await sb.post('tks_stores',{store_name:n,category:document.getElementById('newSCat').value.trim(),assigned_to:document.getElementById('newSAssign').value||null});
  await loadData();rStores(document.getElementById('mainBody'));toast('✅ 已添加 Added');}
async function assignStore(id,uid){await sb.patch('tks_stores',{id},{assigned_to:uid||null});await loadData();toast('✅ 已更新 Updated');}
async function delStore(id,name){if(!confirm('删除 Delete "'+name+'"？\n⚠️ 所有相关记录也会删除！\nAll related records will also be deleted!'))return;
  await sb.del('tks_stores',{id});await loadData();rStores(document.getElementById('mainBody'));toast('🗑️ 已删除 Deleted');}

/* ---- USERS ---- */
async function rUsers(el){
  const r=await sb.rpc('tks_list_users',{p_admin_id:U.id});const users=r.success?r.users:[];
  const roleOpt=(cur)=>['staff','secretary','S','admin'].map(v=>`<option value="${v}" ${v===cur?'selected':''}>${({staff:'Staff 员工',secretary:'Secretary 秘书',S:'S 总负责人',admin:'Admin 管理员'})[v]}</option>`).join('');
  let h=`<div class="main-header"><h1>👥 用户管理 Users</h1><p>User Management</p></div>
    <div class="card"><h3>➕ 创建新用户 Create User</h3>
      <div class="form-row" style="margin-top:14px">
        <div class="fg"><label>用户名 Username *</label><input type="text" id="nuName" autocapitalize="off"></div>
        <div class="fg"><label>显示名 Display Name *</label><input type="text" id="nuDisplay"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>密码 Password *</label><input type="text" id="nuPass"></div>
        <div class="fg"><label>角色 Role</label><select id="nuRole">${roleOpt('staff')}</select></div>
      </div>
      <button class="btn btn-pri" onclick="createUser()" style="max-width:300px">➕ 创建 Create</button>
    </div>
    <div class="sec-title">用户列表 User List</div><div class="card">
    <table class="score-table"><thead><tr><th>用户 User</th><th>角色 Role</th><th>负责店铺 Stores</th><th>状态 Status</th><th>操作 Actions</th></tr></thead><tbody>`;
  for(const u of users){
    const self=u.id===U.id;const uStores=stores.filter(s=>s.assigned_to===u.id);
    h+=`<tr><td><b>${esc(u.display_name)}</b>${self?' (You)':''}<br><span style="font-size:.72rem;color:var(--text3)">@${esc(u.username)}</span></td>
      <td>${self?`<span class="badge ${u.role==='admin'||u.role==='S'?'':(u.role==='secretary'?'badge-secretary':'badge-staff')}">${u.role}</span>`:`<select style="padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:.78rem" onchange="changeUserRole('${u.id}','${esc(u.display_name)}',this.value)">${roleOpt(u.role)}</select>`}</td>
      <td style="font-size:.8rem">${uStores.length?uStores.map(s=>esc(s.store_name)).join(', '):'<span style="color:var(--text3)">—</span>'}</td>
      <td>${u.is_active?'<span style="color:var(--ok)">✅</span>':'<span style="color:var(--bad)">🚫</span>'}</td>
      <td>${self?'—':'<button class="btn btn-ghost btn-sm" onclick="resetPw(\''+u.id+'\',\''+esc(u.display_name)+'\')">🔑</button> <button class="btn btn-ghost btn-sm" onclick="toggleUsr(\''+u.id+'\','+u.is_active+',\''+esc(u.display_name)+'\')">'+(u.is_active?'🚫':'✅')+'</button> <button class="btn btn-ghost btn-sm" onclick="deleteUsr(\''+u.id+'\',\''+esc(u.display_name)+'\')">🗑️</button>'}</td></tr>`}
  h+=`</tbody></table></div>
    <div class="sec-title">修改自己的密码 Change My Password</div><div class="card">
      <div class="form-row"><div class="fg"><label>当前密码 Current Password</label><input type="password" id="cpOld"></div>
        <div class="fg"><label>新密码 New Password</label><input type="password" id="cpNew"></div></div>
      <button class="btn btn-ghost" onclick="chgPw()" style="max-width:300px">🔑 修改密码 Change</button></div>`;
  el.innerHTML=h;
}
async function createUser(){
  const u=document.getElementById('nuName').value.trim(),d=document.getElementById('nuDisplay').value.trim(),p=document.getElementById('nuPass').value,r=document.getElementById('nuRole').value;
  if(!u||!d||!p){toast('请填写所有字段 Please fill in all fields');return}if(p.length<6){toast('密码至少6位 Password must be at least 6 characters');return}
  const res=await sb.rpc('tks_create_user',{p_admin_id:U.id,p_username:u,p_password:p,p_display_name:d,p_role:r});
  if(res.success){toast('✅ 用户已创建 User created!');['nuName','nuDisplay','nuPass'].forEach(i=>document.getElementById(i).value='');await loadData();rUsers(document.getElementById('mainBody'));}
  else toast('❌ '+res.message);
}
async function changeUserRole(id,name,newRole){
  if(!confirm('把 '+name+' 的角色改成 '+newRole+'？\nChange role of '+name+' to '+newRole+'?'))return;
  const r=await sb.rpc('tks_update_user',{p_admin_id:U.id,p_user_id:id,p_role:newRole});
  if(r&&r.success){toast('✅ 角色已更新 Role updated');await loadData();rUsers(document.getElementById('mainBody'));}
  else{toast('❌ '+(r&&r.message||'更新失败，数据库函数可能还不支持改角色 Update failed, database may not support role change yet'));await loadData();rUsers(document.getElementById('mainBody'));}
}
async function deleteUsr(id,name){
  if(!confirm('真的要彻底删除 "'+name+'" 吗？\n这个人之前登记过的记录（开支/任务/聊天等）会保留，但会显示不出名字。\n如果只是想让这个人不能登录，用上面的"禁用"按钮更安全。\n\n确定要删除吗？\n\nPermanently delete this user? Their past records stay but will show no name. To just block login, use Disable instead.'))return;
  const r=await sb.rpc('tks_delete_user',{p_admin_id:U.id,p_user_id:id});
  if(r&&r.success){toast('🗑️ 已删除 Deleted');await loadData();rUsers(document.getElementById('mainBody'));}
  else toast('❌ '+(r&&r.message||'删除失败 Delete failed'));
}
async function resetPw(id,name){const p=prompt('为 '+name+' 设置新密码 New password for '+name+':');if(!p)return;if(p.length<6){toast('密码至少6位 Password must be at least 6 characters');return}
  const r=await sb.rpc('tks_update_user',{p_admin_id:U.id,p_user_id:id,p_password:p});r.success?toast('✅ 密码已重置 Password reset'):toast('❌ '+r.message);}
async function toggleUsr(id,active,name){if(!confirm((active?'禁用 Disable':'启用 Enable')+' '+name+'?'))return;
  const r=await sb.rpc('tks_update_user',{p_admin_id:U.id,p_user_id:id,p_is_active:!active});if(r.success){toast('✅ 已更新 Updated');await loadData();rUsers(document.getElementById('mainBody'));}}
async function chgPw(){const o=document.getElementById('cpOld').value,n=document.getElementById('cpNew').value;
  if(!o||!n){toast('请填写密码 Please enter passwords');return}if(n.length<6){toast('新密码至少6位 New password must be at least 6 characters');return}
  const r=await sb.rpc('tks_change_password',{p_user_id:U.id,p_old_password:o,p_new_password:n});
  if(r.success){toast('✅ 密码已修改 Password changed');document.getElementById('cpOld').value='';document.getElementById('cpNew').value='';}else toast('❌ '+r.message);}

document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPass').focus();});
autoLogin();
